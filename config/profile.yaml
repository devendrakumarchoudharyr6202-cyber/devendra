# Based on the profile details provided by the user.

target_role: "Senior Full Stack Developer"

# Keep the listed profile skills stable; only rotate closely related skills.
core_skills:
  - Angular 12+
  - Angular
  - TypeScript
  - JavaScript
  - RxJS
  - NgRx
  - HTML5
  - CSS3
  - Bootstrap 4
  - Angular Material
  - C#
  - .NET 6
  - .NET 7
  - .NET 8
  - .NET Core
  - ASP.NET Core
  - ASP.NET Core Web API
  - RESTful APIs
  - LINQ
  - Entity Framework Core
  - SQL Server
  - Microservices
  - REST API Integration
  - Authentication & Authorization
  - JWT
  - SOLID Principles
  - Unit Testing
  - Swagger
  - Postman
  - Git
  - GitHub
  - Visual Studio Code

rotate_skills:
  - REST APIs
  - REST API
  - .NET Full Stack Development
  - Angular Development
  - Full Stack Development
  - Web Application Development
  - Frontend Development
  - Backend Development
  - ASP.NET Web API
  - Entity Framework
  - SQL
  - HTML
  - CSS
  - Bootstrap

skill_policy:
  min_total: 25
  max_total: 33
  add_per_run: 1
  remove_per_run: 1
  protect_core: true

headline_variants:
  - "Senior Full Stack Developer | 6+ Years | Angular | C# | .NET Core | ASP.NET Core Web API | SQL Server"
  - "Senior Angular Developer | Angular 12+ | TypeScript | JavaScript | RxJS | NgRx | Angular Material"
  - "Senior Software Engineer | Angular | C# | .NET 6/7/8 | REST APIs | SQL Server | Microservices"
  - "Angular .NET Full Stack Developer | Angular | TypeScript | ASP.NET Core | Entity Framework Core | SQL Server"

summary_variants:
  - |
    Senior Full Stack Developer with 6+ years of experience in Angular,
    TypeScript, JavaScript, C#, .NET Core, ASP.NET Core Web API, SQL Server,
    REST APIs, and modern web application development. Skilled in RxJS, NgRx,
    Entity Framework Core, LINQ, microservices, JWT authentication and
    authorization, and SOLID principles. Experienced with unit testing,
    Swagger, Postman, Git, GitHub, and Visual Studio Code.
  - |
    Senior Full Stack Developer with 6+ years of experience building modern web
    applications using Angular 12+, TypeScript, JavaScript, C#, and .NET.
    Experienced in ASP.NET Core Web API, RESTful API integration, SQL Server,
    Entity Framework Core, LINQ, RxJS, and NgRx. Familiar with microservices,
    JWT authentication and authorization, SOLID principles, unit testing,
    Swagger, Postman, Git, and GitHub.
  - |
    Full Stack Developer with 6+ years of experience across Angular frontend
    development and C#/.NET backend development. Core technologies include
    Angular, TypeScript, JavaScript, RxJS, NgRx, ASP.NET Core Web API, .NET 6/7/8,
    SQL Server, and Entity Framework Core. Works with REST APIs, microservices,
    authentication and authorization, JWT, SOLID principles, and unit testing.
  - |
    Senior Software Engineer with 6+ years of experience in modern web
    application development using Angular, TypeScript, JavaScript, C#, .NET
    Core, ASP.NET Core Web API, and SQL Server. Skilled in REST API integration,
    Entity Framework Core, LINQ, RxJS, NgRx, and microservices, with experience
    using Swagger, Postman, Git, GitHub, and Visual Studio Code.

target_job_titles:
  - Senior Angular Developer
  - Senior Frontend Developer
  - Angular Developer
  - Senior Full Stack Developer
  - .NET Full Stack Developer
  - Angular .NET Developer
  - Software Engineer
  - Senior Software Engineer

resume:
  path: assets/resume.pdf
  reupload_each_run: true

job_apply:
  enabled: true
  min_skill_match: 0.60
  max_apply_per_run: 999
  source: recommended_plus_search
  search_queries:
    - "Senior Angular Developer"
    - "Angular Developer TypeScript RxJS NgRx"
    - "Senior Frontend Developer Angular"
    - "Senior Full Stack Developer Angular .NET"
    - ".NET Full Stack Developer ASP.NET Core"
    - "Angular .NET Developer"
    - "Senior Software Engineer Angular C#"
    - "ASP.NET Core Web API SQL Server"

behavior:
  headless: true
  timeout_ms: 45000
  dry_run: false
