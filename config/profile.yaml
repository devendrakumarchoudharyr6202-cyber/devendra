target_role: "Data Analyst"
experience_years: 1

core_skills:
  - Python
  - SQL
  - Excel
  - Power BI
  - Data Analysis
  - Data Cleaning
  - Data Visualization

rotate_skills:
  - MySQL
  - Data Transformation
  - Exploratory Data Analysis (EDA)
  - Microsoft Power BI
  - Matplotlib
  - Seaborn
  - Pandas
  - NumPy
  - Microsoft Excel
  - VLOOKUP
  - XLOOKUP
  - IF
  - SUMIF
  - COUNTIF
  - Pivot Tables
  - Charts
  - Interactive Dashboards
  - KPI Reporting
  - HTML
  - CSS
  - Jupyter Notebook
  - VS Code
  - Angular
  - TypeScript
  - JavaScript
  - C#
  - .NET Core
  - ASP.NET Core Web API
  - SQL Server
  - REST APIs
  - RxJS
  - NgRx
  - Entity Framework Core
  - LINQ
  - Microservices
  - JWT authentication
  - Swagger
  - GitHub
  - Visual Studio Code

skill_policy:
  min_total: 7
  max_total: 150
  add_per_run: 7
  remove_per_run: 150
  protect_core: true

headline_variants:
  - "Data Analyst | 1 Year Experience | Python | SQL | Excel | Power BI"
  - "Junior Data Analyst | Python | SQL | Excel | Power BI | Data Visualization"
  - "Data Analyst | Data Cleaning | Data Analysis | Python | SQL | Power BI"
  - "Entry-Level Data Analyst | Python | SQL | Excel | Power BI"

summary_variants:
  - |
    Data Analyst with 1 year of experience using Python, SQL, Excel, and Power
    BI for data analysis, data cleaning, and data visualization. Focused on
    accurate analysis and clear reporting.
  - |
    Junior Data Analyst with 1 year of experience working with Python, SQL,
    Excel, and Power BI. Skilled in data cleaning, analysis, and visualization,
    with an interest in turning data into useful business insights.
  - |
    Data Analyst with 1 year of experience in Python, SQL, Excel, and Power BI.
    Experienced in preparing and cleaning data, analyzing datasets, and
    presenting findings through clear visualizations.
  - |
    Entry-level Data Analyst with 1 year of experience applying Python, SQL,
    Excel, and Power BI to data cleaning, analysis, and visualization tasks.

scheduled_summary: |
  Data Analyst with 1 year of experience using Python, SQL, Excel, and Power BI
  for data analysis, data cleaning, and data visualization. Focused on accurate
  analysis and clear reporting.

target_job_titles:
  - Data Analyst
  - Junior Data Analyst
  - MIS Executive
  - Python Developer
  - SQL Developer
  - Business Analyst Intern
  - Data Analyst Intern

resume:
  path: assets/resume.pdf
  reupload_each_run: true

job_apply:
  enabled: true
  min_skill_match: 0.60
  max_apply_per_run: 50
  max_apply_per_day: 50
  max_posting_age_hours: 24
  source: recommended_plus_search
  search_queries:
    - "Data Analyst fresher"
    - "Junior Data Analyst"
    - "MIS Executive fresher"
    - "Python Developer 0-1 years"
    - "SQL Developer fresher"
    - "Business Analyst Intern"
    - "Data Analyst Intern"

behavior:
  headless: false
  timeout_ms: 45000
  dry_run: false
