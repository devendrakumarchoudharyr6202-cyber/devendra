target_role: "Data Analyst"
experience_years: 1

core_skills:
  - Python
  - SQL
  - MySQL
  - Excel
  - Power BI
  - Tableau
  - Data Analysis
  - Data Cleaning
  - Data Visualization
  - Exploratory Data Analysis (EDA)
  - Pandas
  - NumPy
  - Matplotlib
  - Data Reporting

rotate_skills:
  - Microsoft Excel
  - Excel Formulas
  - Pivot Tables
  - Power BI Dashboards
  - SQL Queries
  - Data Transformation
  - Dashboard Design
  - KPI Reporting
  - Data Storytelling
  - Business Intelligence
  - Jupyter Notebook
  - GitHub
  - Data Validation
  - Analytical Thinking
  - Problem Solving

skill_policy:
  min_total: 7
  max_total: 150
  add_per_run: 20
  remove_per_run: 0
  protect_core: true

headline_variants:
  - "Data Analyst | SQL | Python | Excel | Power BI | Tableau"
  - "Aspiring Data Analyst | Python | SQL | Excel | Power BI | Data Visualization"
  - "Data Analyst Intern | Data Cleaning | Data Analysis | Python | SQL | Power BI"
  - "Computer Science Engineer | Data Analyst | Python | SQL | Excel | Power BI"

summary_variants:
  - |
    Aspiring Data Analyst with internship and project-based experience in SQL,
    Python, Excel, Power BI, and Tableau. Skilled in data cleaning,
    exploratory data analysis, dashboard creation, and turning raw data into
    actionable business insights.
  - |
    Junior Data Analyst with hands-on experience using Python, SQL, Excel, and
    Power BI for data cleaning, analysis, and visualization. Focused on
    generating clear reporting and supporting data-driven decisions.
  - |
    Data Analyst with experience in preparing and cleaning data, analyzing
    datasets, and presenting insights through effective dashboards and reports.
    Comfortable working with Python, SQL, Excel, and Power BI.
  - |
    Computer Science Engineer transitioning into data analytics with a strong
    foundation in SQL, Python, Excel, and Power BI. Interested in solving
    business problems through data-driven insights and dashboards.

scheduled_summary: |
  Aspiring Data Analyst with internship and project-based experience in SQL,
  Python, Excel, Power BI, and Tableau. Skilled in data cleaning,
  exploratory data analysis, dashboard creation, and turning raw data into
  actionable business insights.

target_job_titles:
  - Data Analyst
  - Junior Data Analyst
  - Data Analyst Intern
  - MIS Executive
  - Business Analyst
  - BI Analyst

resume:
  path: assets/resume.pdf
  reupload_each_run: true

job_apply:
  enabled: true
  min_skill_match: 0.60
  require_skill_match: true
  require_target_title_match: false
  max_apply_per_run: 50
  max_apply_per_day: 50
  experience_min_years: 0
  experience_max_years: 5
  max_posting_age_hours: 24
  source: recommended_plus_search
  search_queries:
    - "Data Analyst 0-5 years"
    - "Junior Data Analyst 0-5 years"
    - "MIS Executive 0-5 years"
    - "Python Developer 0-5 years"
    - "SQL Developer 0-5 years"
    - "Business Analyst 0-5 years"
    - "Data Analyst Intern 0-5 years"

behavior:
  headless: false
  timeout_ms: 45000
  dry_run: false
