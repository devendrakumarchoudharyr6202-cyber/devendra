# Resume headline (Naukri hard limit ~250 chars).
headline_variants:
  - "QA Automation Engineer | 5 Years Experience | Playwright | JavaScript | Selenium | BDD | Cucumber | API Testing | POM | JIRA"
  - "Automation Test Engineer | Playwright | JavaScript | TypeScript | BDD | Cucumber | API Testing | Page Object Model | CI/CD"
  - "SDET / QA Automation Engineer | 5 Years QA Experience | Playwright | JavaScript | Selenium | API Automation | BDD | Cucumber | Git"
  - "QA Automation Engineer | Playwright | JavaScript | API Testing | BDD | Cucumber | POM | Git | CI/CD | Manual Testing"

# Profile summary variants (longer; keep truthful to resume).
summary_variants:
  - |
    QA Automation Engineer with 5 years of experience in Software Testing,
    specializing in Playwright, JavaScript, Selenium, BDD, Cucumber, and Page
    Object Model. Hands-on experience in Functional, Regression, Integration,
    API, and Exploratory Testing. Experienced in using AI tools such as
    ChatGPT, GitHub Copilot, and GenAI techniques to improve test case
    creation, test analysis, automation development, and QA productivity.
    Skilled in JIRA, Agile/Scrum, defect lifecycle management, and web
    application testing. Strong interest in AI-powered test automation and
    GenAI QA.
  - |
    QA Engineer with 5 years of experience in Manual and Automation Testing,
    with hands-on expertise in Playwright, JavaScript, Selenium, BDD/Cucumber,
    POM, and API Testing. Experienced in developing automation scripts,
    executing regression suites, debugging failures, and managing defects using
    JIRA. Also working with GenAI and AI-assisted testing tools to generate
    test scenarios, improve automation code, analyze requirements, and enhance
    testing efficiency. Focused on building expertise in AI-powered QA and
    modern test automation.
  - |
    QA Automation Engineer / SDET with 5 years of experience in software
    quality assurance and test automation. Proficient in Playwright, JavaScript,
    Selenium, BDD, Cucumber, POM, API Testing, Git, and JIRA. Hands-on
    experience with AI-assisted software testing using ChatGPT, GitHub Copilot,
    prompt engineering, and GenAI-based approaches for test case generation
    and automation support. Experienced in Agile environments with strong
    knowledge of Functional, Regression, Integration, and Exploratory Testing.
  - |
    Automation Test Engineer with 5 years of QA experience, combining strong
    Manual Testing fundamentals with Playwright and JavaScript automation.
    Experienced in BDD/Cucumber, POM, API Testing, Functional, Regression,
    Integration, and Exploratory Testing. Leveraging GenAI tools and
    AI-assisted development to accelerate test case creation, requirement
    analysis, automation scripting, debugging, and test coverage. Currently
    focused on advancing expertise in GenAI QA, AI-powered testing, Playwright
    automation, and modern QA practices.

resume:
  path: assets/resume.pdf
  reupload_each_run: true

# Auto-apply recommended jobs
job_apply:
  enabled: true
  min_skill_match: 0.60
  max_apply_per_run: 999
  source: recommended_plus_search
  search_queries:
    - "Playwright Automation"
    - "Manual Testing"
    - "QA Engineer Pune"
    - "BDD Cucumber"
    - "Mobile Testing BrowserStack"

behavior:
  headless: true
  timeout_ms: 45000
  dry_run: false
