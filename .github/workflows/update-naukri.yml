name: Update Naukri Profile

on:
  schedule:
    # Try at 08:00-20:00 IST, retry 15 minutes later if the hour has not succeeded.
    - cron: "30,45 2-14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview summary update and skip profile saves/resume upload"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: naukri-profile-update
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check whether this India-time hour needs an update
        id: hour_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "Manual run requested; proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Asia/Kolkata date +%H)"
          if (( 10#$local_hour < 8 || 10#$local_hour > 20 )); then
            echo "Outside the 08:00-20:00 India-time update window"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_hour="$(TZ=Asia/Kolkata date +'%Y-%m-%d-%H')"
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update-naukri.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), (.run_started_at // .created_at)] | @tsv')"

          while IFS=$'\t' read -r run_id status conclusion run_time; do
            [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            if [[ "$status" != "queued" && "$status" != "in_progress" &&
                  ( "$status" != "completed" || "$conclusion" != "success" ) ]]; then
              continue
            fi

            run_hour="$(TZ=Asia/Kolkata date -d "$run_time" +'%Y-%m-%d-%H')"
            if [[ "$run_hour" == "$current_hour" ]]; then
              echo "An active or successful update already exists this India-time hour"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"

          echo "No active or successful update yet this India-time hour; proceeding"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.hour_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Validate Naukri authentication
        if: steps.hour_guard.outputs.should_run == 'true'
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE_GZ_B64: ${{ secrets.NAUKRI_STORAGE_STATE_GZ_B64 }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$NAUKRI_STORAGE_STATE_GZ_B64" ]; then
            echo "Compressed Naukri session secret is configured"
          elif [ -n "$NAUKRI_STORAGE_STATE_B64" ]; then
            echo "Legacy Base64 Naukri session secret is configured"
          elif [ -n "$NAUKRI_EMAIL" ] && [ -n "$NAUKRI_PASSWORD" ]; then
            echo "Naukri email/password secrets are configured"
          else
            echo "::error::Configure Actions secrets NAUKRI_EMAIL and NAUKRI_PASSWORD, or provide a Naukri session secret."
            exit 1
          fi

      - name: Set up Python
        if: steps.hour_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.hour_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore resume from secret (optional)
        if: steps.hour_guard.outputs.should_run == 'true'
        env:
          RESUME_B64: ${{ secrets.RESUME_B64 }}
        run: |
          if [ -n "$RESUME_B64" ]; then
            mkdir -p assets
            echo "$RESUME_B64" | base64 -d > assets/resume.pdf
            echo "Restored assets/resume.pdf from secret"
          else
            echo "RESUME_B64 not provided; keeping repository resume"
          fi

      - name: Run Naukri agent
        if: steps.hour_guard.outputs.should_run == 'true'
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE_GZ_B64: ${{ secrets.NAUKRI_STORAGE_STATE_GZ_B64 }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
          NAUKRI_MODE: resume_summary
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py

      - name: Upload artifacts on failure/success
        if: always() && steps.hour_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: naukri-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
