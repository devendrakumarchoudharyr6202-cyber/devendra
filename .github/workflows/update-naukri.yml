name: Update Naukri Profile

on:
  schedule:
    # Every 30 minutes (UTC).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan changes but skip Save/Upload"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: naukri-profile-update
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Naukri authentication
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$NAUKRI_STORAGE_STATE_B64" ]; then
            echo "Authenticated Naukri session secret is configured"
          elif [ -n "$NAUKRI_EMAIL" ] && [ -n "$NAUKRI_PASSWORD" ]; then
            echo "Naukri email/password secrets are configured"
          else
            echo "::error::Configure Actions secrets NAUKRI_EMAIL and NAUKRI_PASSWORD, or provide NAUKRI_STORAGE_STATE_B64."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore resume from secret (optional)
        env:
          RESUME_B64: ${{ secrets.RESUME_B64 }}
        run: |
          if [ -n "$RESUME_B64" ]; then
            mkdir -p assets
            echo "$RESUME_B64" | base64 -d > assets/resume.pdf
            echo "Restored assets/resume.pdf from secret"
          else
            echo "RESUME_B64 not provided; keeping repository resume"
          fi

      - name: Run Naukri agent
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
          NAUKRI_MODE: profile
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py

      - name: Upload artifacts on failure/success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
