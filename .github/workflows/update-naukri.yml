name: Update Naukri Profile

on:
  schedule:
    # 09:00, 12:00 and 14:00 IST.
    - cron: "30 3,6,8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview profile and matching jobs without saving or applying"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: naukri-daily-automation
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check whether this India-time hour needs an update
        id: hour_guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -ne "schedule") {
            Write-Host "Manual run requested; proceeding"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_run=true"
            exit 0
          }

          $indiaTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById("India Standard Time")
          $nowIndia = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $indiaTimeZone)
          if ($nowIndia.Hour -lt 8 -or $nowIndia.Hour -gt 20) {
            Write-Host "Outside the 08:00-20:00 India-time update window"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_run=false"
            exit 0
          }

          $currentHour = $nowIndia.ToString("yyyy-MM-dd-HH")
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/update-naukri.yml/runs?branch=main&per_page=100"
          $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs

          foreach ($run in $runs) {
            if ($run.id.ToString() -eq $env:GITHUB_RUN_ID) {
              continue
            }

            $isActive = $run.status -in @("queued", "in_progress")
            $isSuccessful = $run.status -eq "completed" -and $run.conclusion -eq "success"
            if (-not $isActive -and -not $isSuccessful) {
              continue
            }

            $runTime = $run.run_started_at
            if (-not $runTime) {
              $runTime = $run.created_at
            }
            $runUtc = [DateTime]::Parse(
              $runTime,
              [Globalization.CultureInfo]::InvariantCulture,
              [Globalization.DateTimeStyles]::AdjustToUniversal
            )
            $runIndia = [TimeZoneInfo]::ConvertTimeFromUtc($runUtc, $indiaTimeZone)
            if ($runIndia.ToString("yyyy-MM-dd-HH") -eq $currentHour) {
              Write-Host "An active or successful update already exists this India-time hour"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "should_run=false"
              exit 0
            }
          }

          Write-Host "No active or successful update yet this India-time hour; proceeding"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "should_run=true"

      - name: Checkout
        if: steps.hour_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Configure persistent application log
        if: steps.hour_guard.outputs.should_run == 'true'
        shell: powershell
        run: |
          $workRoot = Split-Path -Parent (Split-Path -Parent $env:GITHUB_WORKSPACE)
          $logPath = Join-Path $workRoot "naukri_applications.csv"
          Add-Content -Path $env:GITHUB_ENV -Value "NAUKRI_APPLICATION_LOG_PATH=$logPath"

      - name: Validate Naukri authentication
        if: steps.hour_guard.outputs.should_run == 'true'
        env:
          NAUKRI_STORAGE_STATE_GZ_B64: ${{ secrets.NAUKRI_STORAGE_STATE_GZ_B64 }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NAUKRI_STORAGE_STATE_GZ_B64)) {
            Write-Host "Compressed Naukri session secret is configured"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:NAUKRI_STORAGE_STATE_B64)) {
            Write-Host "Legacy Base64 Naukri session secret is configured"
          } else {
            Write-Error "This workflow requires an authenticated Naukri session. Configure NAUKRI_STORAGE_STATE_GZ_B64."
            exit 1
          }

      - name: Set up Python
        if: steps.hour_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hour_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Restore résumé from secret or verify checked-in résumé
        if: steps.hour_guard.outputs.should_run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          RESUME_B64: ${{ secrets.RESUME_B64 }}
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:RESUME_B64)) {
            New-Item -ItemType Directory -Force -Path assets | Out-Null
            $resumeBytes = [Convert]::FromBase64String($env:RESUME_B64)
            [IO.File]::WriteAllBytes((Join-Path $PWD "assets\resume.pdf"), $resumeBytes)
            Write-Host "Restored assets/resume.pdf from secret"
          } elseif (Test-Path "assets\resume.pdf") {
            Write-Host "Using assets/resume.pdf from the repository"
          } else {
            Write-Error "Résumé missing. Configure the RESUME_B64 Actions secret or include assets/resume.pdf in the repository."
            exit 1
          }

      - name: Run Naukri agent
        if: steps.hour_guard.outputs.should_run == 'true'
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE_GZ_B64: ${{ secrets.NAUKRI_STORAGE_STATE_GZ_B64 }}
          NAUKRI_STORAGE_STATE_B64: ${{ secrets.NAUKRI_STORAGE_STATE_B64 }}
          NAUKRI_MODE: both
          HEADLESS: "0"
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py --mode both

      - name: Add run report to workflow summary
        if: always() && steps.hour_guard.outputs.should_run == 'true'
        shell: powershell
        run: |
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\run_report.json"
          if (-not (Test-Path $reportPath)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Naukri automation report`nReport file was not created; inspect the failed workflow step."
            exit 0
          }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          $lines = @(
            "## Naukri automation report",
            "- Run time (IST): $($report.generated_at_ist)",
            "- Profile update: $(if ($report.profile) { 'completed' } else { 'failed or unavailable' })"
          )
          if ($report.profile) {
            $lines += "- Résumé upload verified: $($report.profile.resume_uploaded)"
            $lines += "- Skills added: $(@($report.profile.skills.added).Count); removed: $(@($report.profile.skills.removed).Count)"
          }
          if ($report.apply) {
            $lines += "- Jobs found: $($report.apply.jobs_found)"
            $lines += "- Matching jobs: $($report.apply.jobs_matching_criteria)"
            $lines += "- Applications confirmed: $($report.apply.applied_count)"
            $lines += "- Awaiting confirmation / unconfirmed: $($report.apply.applications_unconfirmed.Count)"
            foreach ($pending in $report.apply.applications_unconfirmed) {
              if ($pending.status -eq "pending_confirmation" -and $pending.application_link) {
                $lines += "- Approval needed: [$($pending.title) @ $($pending.company)]($($pending.application_link))"
              }
            }
          }
          foreach ($errorItem in $report.errors) {
            $lines += "- ERROR ($($errorItem.stage)): $($errorItem.message)"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")

      - name: Copy application ledger to artifact
        if: always() && steps.hour_guard.outputs.should_run == 'true'
        shell: powershell
        run: |
          $ledgerPath = $env:NAUKRI_APPLICATION_LOG_PATH
          if ($ledgerPath -and (Test-Path $ledgerPath)) {
            $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts"
            New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
            Copy-Item $ledgerPath (Join-Path $artifactDirectory "application_log.csv") -Force
          }

      - name: Upload artifacts on failure/success
        if: always() && steps.hour_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: naukri-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
